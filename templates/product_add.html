{% extends "base.html" %}

{% block title %}
商品追加
{% endblock %}

{% block content %}

<h2>商品追加</h2>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="POST">

    <p>
        商品名
        <input type="text" name="name">
    </p>

    <button type="submit">
        商品を追加
    </button>

    <p>
    適正在庫
    <input type="number" name="proper_stock" min="0">
    </p>

</form>

<p>
    <a href="{{ url_for('home') }}">
        商品一覧へ戻る
    </a>
</p>

{% endblock %}
